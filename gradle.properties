# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run tasks in parallel across decoupled modules
org.gradle.parallel=true

# Cache task outputs locally to accelerate repeated builds
org.gradle.caching=true

# Configuration Cache skips configuration phase on subsequent runs
org.gradle.configuration-cache=true

# Kotlin code style for this project
kotlin.code.style=official

# Android Gradle Plugin settings
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
org.gradle.tooling.parallel=true
