version: 2
updates:
  - package-ecosystem: github-actions
    labels: []
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    labels: []
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
