name: Bug report
description: Report a crash or incorrect behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach database exports, backups or logs that contain personal workout or body data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in Settings, or the release tag of the APK you installed.
      placeholder: "v1.4.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 6, Android 14"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash log
      description: Optional. Stack trace from `adb logcat`, with personal data removed.
      render: text
